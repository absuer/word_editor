    <text x="1036" y="103" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">相对于 Dify 的优势</text>

    <!-- Advantage cards -->
    <g id="adv1">
      <rect x="886" y="124" width="300" height="36" fill="#F5F6FA"/>
      <rect x="886" y="124" width="3" height="36" fill="#1A73E8"/>
      <text x="898" y="140" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="13" font-weight="bold" fill="#1A1D2E">极简部署</text>
