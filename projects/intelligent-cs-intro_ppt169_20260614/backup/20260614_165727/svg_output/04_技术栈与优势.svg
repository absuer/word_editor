    <text x="220" y="420" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">对比维度</text>
    <text x="580" y="420" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" font-weight="bold" fill="#00D4FF">本项目</text>
    <text x="930" y="420" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" font-weight="bold" fill="#FF6B9D">Dify 平台</text>

    <!-- Row 1 -->
    <rect x="80" y="432" width="1120" height="36" fill="#F5F6FA"/>
    <text x="220" y="455" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" font-weight="bold" fill="#1A1D2E">部署方式</text>
    <text x="580" y="455" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" fill="#1A73E8" font-weight="bold">pip install + streamlit run</text>
    <text x="930" y="455" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" fill="#6B7280">Docker Compose（PostgreSQL + Redis + Weaviate + …）</text>

    <!-- Row 2 -->
    <rect x="80" y="468" width="1120" height="36" fill="#FFFFFF"/>
    <text x="220" y="491" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" font-weight="bold" fill="#1A1D2E">中文分块</text>
    <text x="580" y="491" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" fill="#1A73E8" font-weight="bold">RecursiveTextSplitter · 。感知分隔</text>
    <text x="930" y="491" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" fill="#6B7280">默认英文分隔符（\n\n, \n, 空格）</text>

    <!-- Row 3 -->
    <rect x="80" y="504" width="1120" height="36" fill="#F5F6FA"/>
    <text x="220" y="527" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" font-weight="bold" fill="#1A1D2E">硬件需求</text>
    <text x="580" y="527" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" fill="#1A73E8" font-weight="bold">仅需 CPU · 内存 &lt; 2GB</text>
    <text x="930" y="527" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" fill="#6B7280">推荐 GPU · 内存建议 8GB+</text>

    <!-- Row 4 -->
    <rect x="80" y="540" width="1120" height="36" fill="#FFFFFF"/>
    <text x="220" y="563" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" font-weight="bold" fill="#1A1D2E">代码复杂度</text>
    <text x="580" y="563" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" fill="#1A73E8" font-weight="bold">~500 行 · 4 个模块</text>
    <text x="930" y="563" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" fill="#6B7280">数十万行 · 微服务架构</text>

    <!-- Row 5 -->
    <rect x="80" y="576" width="1120" height="36" fill="#F5F6FA"/>
    <text x="220" y="599" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" font-weight="bold" fill="#1A1D2E">联网搜索</text>
    <text x="580" y="599" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" fill="#1A73E8" font-weight="bold">DuckDuckGo 内置 · 免费使用</text>
    <text x="930" y="599" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" fill="#6B7280">需额外配置 API Key 或插件</text>

    <!-- Row 6 -->
    <rect x="80" y="612" width="1120" height="36" fill="#FFFFFF"/>
    <text x="220" y="635" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" font-weight="bold" fill="#1A1D2E">定制难度</text>
    <text x="580" y="635" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" fill="#1A73E8" font-weight="bold">直接修改源码 · 即改即用</text>
    <text x="930" y="635" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" fill="#6B7280">需理解 Dify DSL + 插件体系</text>
