      <text x="898" y="182" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="13" font-weight="bold" fill="#1A1D2E">中文原生支持</text>
      <text x="898" y="197" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="11" fill="#6B7280">。感知分块 · Dify 默认英文分割</text>
    </g>
    <g id="adv3">
      <rect x="886" y="208" width="300" height="36" fill="#F5F6FA"/>
      <rect x="886" y="208" width="3" height="36" fill="#E8456B"/>
      <text x="898" y="224" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="13" font-weight="bold" fill="#1A1D2E">零外部依赖</text>
