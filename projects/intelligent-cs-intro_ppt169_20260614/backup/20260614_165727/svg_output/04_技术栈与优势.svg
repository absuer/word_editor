      <text x="898" y="350" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="13" font-weight="bold" fill="#1A1D2E">联网回退内置</text>
      <text x="898" y="365" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="11" fill="#6B7280">DuckDuckGo 免费 · Dify 需额外插件</text>
    </g>
