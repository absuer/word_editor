<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="bg-layer"><rect x="0" y="0" width="1280" height="720" fill="#EDEFF4"/></g>
  <g id="page-header">
    <rect x="80" y="36" width="4" height="28" rx="2" fill="#1A73E8"/>
    <text x="100" y="60" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="36" font-weight="bold" fill="#1A1D2E">运行与部署</text>
    <text x="100" y="80" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="13" fill="#6B7280" letter-spacing="2">RUN &amp; DEPLOY — COMMANDS · CONFIGURATION · DATA PATHS</text>
  </g>

  <!-- Left: Commands -->
  <g id="left"><rect x="80" y="105" width="550" height="550" fill="#FFFFFF" stroke="#D8DAE4" stroke-width="0.5"/>
    <rect x="80" y="105" width="550" height="4" fill="#1A73E8"/>
    <use data-icon="phosphor-duotone/terminal-window" x="110" y="132" width="28" height="28" fill="#1A73E8"/>
    <text x="150" y="152" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="20" font-weight="bold" fill="#1A1D2E">命令速查</text>

    <g id="cmd1"><rect x="108" y="175" width="494" height="78" fill="#F5F6FA"/>
      <rect x="108" y="175" width="4" height="78" fill="#00C853"/>
      <text x="128" y="202" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" font-weight="bold" fill="#00C853">安装依赖</text>
      <rect x="128" y="214" width="450" height="30" fill="#EDEFF4"/>
      <text x="144" y="235" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1A1D2E">pip install -r requirements.txt</text>
    </g>
    <g id="cmd2"><rect x="108" y="265" width="494" height="78" fill="#FFFFFF"/>
      <rect x="108" y="265" width="4" height="78" fill="#1A73E8"/>
      <text x="128" y="292" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" font-weight="bold" fill="#1A73E8">启动应用</text>
      <rect x="128" y="304" width="450" height="30" fill="#EDEFF4"/>
      <text x="144" y="325" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1A1D2E">streamlit run app.py</text>
    </g>
    <g id="cmd3"><rect x="108" y="355" width="494" height="78" fill="#F5F6FA"/>
      <rect x="108" y="355" width="4" height="78" fill="#6C3FD4"/>
      <text x="128" y="382" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" font-weight="bold" fill="#6C3FD4">运行测试</text>
      <rect x="128" y="394" width="450" height="30" fill="#EDEFF4"/>
      <text x="144" y="415" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1A1D2E">pytest tests/ -v</text>
    </g>
    <g id="cmd4"><rect x="108" y="445" width="494" height="78" fill="#FFFFFF"/>
      <rect x="108" y="445" width="4" height="78" fill="#E8456B"/>
      <text x="128" y="472" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" font-weight="bold" fill="#E8456B">单独测试</text>
      <rect x="128" y="484" width="450" height="30" fill="#EDEFF4"/>
      <text x="144" y="505" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1A1D2E">pytest tests/test_agent.py -k test_retriever</text>
    </g>

    <rect x="108" y="545" width="494" height="80" fill="#F5F6FA"/>
    <text x="128" y="572" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" font-weight="bold" fill="#1A1D2E">测试覆盖</text>
    <text x="128" y="595" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="13" fill="#6B7280">test_e2e.py: 文件加载 → 向量存储 → 搜索 → Agent 创建 → 记忆</text>
    <text x="128" y="615" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="13" fill="#6B7280">tempfile.TemporaryDirectory 隔离 · store.close() 释放文件锁</text>
  </g>

  <!-- Right: Config -->
  <g id="right"><rect x="648" y="105" width="552" height="550" fill="#FFFFFF" stroke="#D8DAE4" stroke-width="0.5"/>
    <rect x="648" y="105" width="552" height="4" fill="#6C3FD4"/>
    <use data-icon="phosphor-duotone/gear" x="678" y="132" width="28" height="28" fill="#6C3FD4"/>
    <text x="718" y="152" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="20" font-weight="bold" fill="#1A1D2E">环境配置</text>

    <rect x="676" y="175" width="496" height="140" fill="#F5F6FA"/>
    <text x="696" y="200" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" fill="#1A73E8">.env 文件</text>
    <rect x="696" y="214" width="456" height="85" fill="#EDEFF4"/>
    <text x="714" y="236" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#1A1D2E">ANTHROPIC_AUTH_TOKEN=sk-xxx</text>
    <text x="714" y="256" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#1A1D2E">ANTHROPIC_BASE_URL=https://api.deepseek.com/anthropic</text>
    <text x="714" y="276" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#1A1D2E">ANTHROPIC_MODEL=deepseek-v4-pro</text>
    <text x="714" y="294" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="11" fill="#6B7280">.env gitignored · python-dotenv 加载</text>

    <rect x="676" y="330" width="496" height="80" fill="#FFFFFF"/>
    <text x="696" y="355" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="15" font-weight="bold" fill="#1A1D2E">LLM 端点</text>
    <text x="696" y="378" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="13" fill="#6B7280">DeepSeek OpenAI-compatible /v1 endpoint</text>
    <text x="696" y="398" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#6C3FD4">LLM_OPENAI_BASE_URL = "https://api.deepseek.com/v1"</text>

    <rect x="676" y="425" width="496" height="95" fill="#F5F6FA"/>
    <text x="696" y="450" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="15" font-weight="bold" fill="#1A1D2E">数据目录</text>
    <text x="696" y="475" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1A73E8">data/chroma_db/</text>
    <text x="860" y="475" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="13" fill="#6B7280">向量库持久化</text>
    <text x="696" y="496" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#6C3FD4">data/uploads/</text>
    <text x="860" y="496" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="13" fill="#6B7280">原始文件 UUID 保存</text>
    <text x="696" y="517" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#E8456B">data/app.log</text>
    <text x="860" y="517" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="13" fill="#6B7280">日志 UTF-8 · 侧边栏可查看</text>
  </g>

  <g id="page-footer">
    <rect x="80" y="680" width="1120" height="1" fill="#D8DAE4"/>
    <text x="1200" y="700" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#6B7280">11 / 12</text>
  </g>
</svg>
