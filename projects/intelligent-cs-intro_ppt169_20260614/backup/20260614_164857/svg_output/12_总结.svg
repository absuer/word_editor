    <g id="t1"><rect x="108" y="240" width="1064" height="70" fill="#F5F6FA"/>
      <text x="130" y="272" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="bold" fill="#1A73E8">01</text>
