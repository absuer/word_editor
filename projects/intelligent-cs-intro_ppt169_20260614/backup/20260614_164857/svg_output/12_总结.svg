    <rect x="0" y="0" width="6" height="720" fill="#1A73E8"/>
    <rect x="0" y="280" width="6" height="140" fill="#6C3FD4"/>
  </g>

  <!-- Title -->
  <g id="main-title">
    <text x="80" y="160" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="60" font-weight="bold" fill="#1A1D2E">总结</text>
    <rect x="80" y="180" width="60" height="3" fill="#1A73E8"/>
  </g>

  <!-- Takeaways -->
  <g id="takeaways">
