<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="titleGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#7C5CFC"/>
    </linearGradient>
    <linearGradient id="bottomFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0E27" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0A0E27" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="75%" cy="60%" r="30%">
      <stop offset="0%" stop-color="#7C5CFC" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#7C5CFC" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hexGrid" x="0" y="0" width="60" height="52" patternUnits="userSpaceOnUse" data-pptx-pattern="lgGrid">
      <rect width="60" height="52" fill="#0A0E27"/>
      <path d="M 30 0 L 60 17 L 60 43 L 30 52 L 0 43 L 0 17 Z" fill="none" stroke="#1E2244" stroke-width="0.5"/>
    </pattern>
    <filter id="titleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feFlood flood-color="#00D4FF" flood-opacity="0.4" result="glowColor"/>
      <feComposite in="glowColor" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <g id="bg-layer">
    <rect x="0" y="0" width="1280" height="720" fill="#0A0E27"/>
    <rect x="0" y="0" width="1280" height="720" fill="url(#hexGrid)" fill-opacity="0.5"/>
    <rect x="0" y="0" width="1280" height="720" fill="url(#centerGlow)"/>
    <rect x="0" y="0" width="1280" height="720" fill="url(#purpleGlow)"/>
  </g>

  <!-- Decorative: top-right accent shapes -->
  <g id="decor-top-right">
    <circle cx="1100" cy="180" r="120" fill="none" stroke="#00D4FF" stroke-width="1" stroke-opacity="0.15"/>
    <circle cx="1100" cy="180" r="80" fill="none" stroke="#7C5CFC" stroke-width="1" stroke-opacity="0.1"/>
    <circle cx="1100" cy="180" r="4" fill="#00D4FF" fill-opacity="0.4"/>
    <line x1="180" y1="80" x2="350" y2="80" stroke="#00D4FF" stroke-width="1" stroke-opacity="0.2"/>
    <line x1="940" y1="640" x2="1100" y2="640" stroke="#7C5CFC" stroke-width="1" stroke-opacity="0.15"/>
  </g>

  <!-- Decorative: bottom-left accent -->
  <g id="decor-bottom-left">
    <rect x="80" y="620" width="200" height="1" fill="#00D4FF" fill-opacity="0.25"/>
    <rect x="80" y="626" width="80" height="1" fill="#7C5CFC" fill-opacity="0.3"/>
  </g>

  <!-- Decorative node lines -->
  <g id="decor-nodes">
    <circle cx="200" cy="200" r="2" fill="#00D4FF" fill-opacity="0.3"/>
    <circle cx="350" cy="150" r="1.5" fill="#7C5CFC" fill-opacity="0.25"/>
    <circle cx="1050" cy="550" r="2" fill="#00D4FF" fill-opacity="0.2"/>
    <circle cx="950" cy="500" r="1.5" fill="#FF6B9D" fill-opacity="0.2"/>
    <line x1="200" y1="200" x2="350" y2="150" stroke="#00D4FF" stroke-width="0.5" stroke-opacity="0.15"/>
    <line x1="350" y1="150" x2="1100" y2="180" stroke="#7C5CFC" stroke-width="0.5" stroke-opacity="0.1"/>
  </g>

  <!-- Robot icon placeholder -->
  <g id="cover-icon" fill-opacity="0.15" fill="#00D4FF">
    <rect x="590" y="155" width="100" height="100" rx="20" fill="none" stroke="#00D4FF" stroke-width="1.5"/>
    <circle cx="615" cy="190" r="8" fill="#00D4FF"/>
    <circle cx="665" cy="190" r="8" fill="#00D4FF"/>
    <rect x="620" y="210" width="40" height="8" rx="4" fill="#00D4FF"/>
    <rect x="610" y="170" width="12" height="15" rx="3" fill="#00D4FF"/>
    <rect x="658" y="170" width="12" height="15" rx="3" fill="#00D4FF"/>
  </g>

  <!-- Main Title -->
  <g id="cover-title">
    <text x="640" y="320" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="72" font-weight="bold" fill="url(#titleGlowGrad)" filter="url(#titleGlow)">智能客服系统</text>
  </g>

  <!-- Subtitle -->
  <g id="cover-subtitle">
    <text x="640" y="380" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="28" font-weight="bold" fill="#A0A4B8">基于 RAG 的智能问答平台</text>
    <text x="640" y="420" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="22" fill="#A0A4B8" fill-opacity="0.7">技术架构解析</text>
  </g>

  <!-- Divider line under subtitle -->
  <g id="cover-divider">
    <rect x="540" y="450" width="80" height="3" rx="1.5" fill="#00D4FF" fill-opacity="0.6"/>
    <rect x="628" y="450" width="40" height="3" rx="1.5" fill="#7C5CFC" fill-opacity="0.4"/>
    <rect x="676" y="450" width="64" height="3" rx="1.5" fill="#00D4FF" fill-opacity="0.6"/>
  </g>

  <!-- Bottom info -->
  <g id="cover-footer">
    <text x="640" y="660" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="15" fill="#A0A4B8" fill-opacity="0.5">Streamlit + LangChain/LangGraph + ChromaDB + DeepSeek</text>
    <text x="640" y="685" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="13" fill="#A0A4B8" fill-opacity="0.35">2026.06</text>
  </g>
</svg>
