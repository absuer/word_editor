<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#7C5CFC"/>
    </linearGradient>
    <radialGradient id="topGlow" cx="50%" cy="0%" r="50%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <g id="bg-layer">
    <rect x="0" y="0" width="1280" height="720" fill="#0A0E27"/>
    <rect x="0" y="0" width="1280" height="720" fill="url(#topGlow)"/>
  </g>

  <!-- Page header -->
  <g id="page-header">
    <text x="100" y="100" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="36" font-weight="bold" fill="#E8E8F0">目录</text>
    <text x="100" y="125" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="15" fill="#A0A4B8">AGENDA</text>
    <rect x="100" y="138" width="60" height="3" rx="1.5" fill="url(#accentLine)"/>
  </g>

  <!-- Agenda items -->
  <g id="agenda-items">
    <!-- Item 01 -->
    <g id="agenda-01">
      <text x="160" y="230" font-family="Consolas, 'Courier New', monospace" font-size="48" font-weight="bold" fill="#00D4FF" fill-opacity="0.25">01</text>
      <rect x="240" y="200" width="3" height="40" rx="1.5" fill="#00D4FF" fill-opacity="0.4"/>
      <text x="270" y="230" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="24" fill="#E8E8F0">项目概述</text>
      <text x="270" y="255" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="15" fill="#A0A4B8">系统定位与核心能力介绍</text>
    </g>

    <!-- Item 02 -->
    <g id="agenda-02">
      <text x="160" y="330" font-family="Consolas, 'Courier New', monospace" font-size="48" font-weight="bold" fill="#7C5CFC" fill-opacity="0.25">02</text>
      <rect x="240" y="300" width="3" height="40" rx="1.5" fill="#7C5CFC" fill-opacity="0.4"/>
      <text x="270" y="330" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="24" fill="#E8E8F0">技术栈一览</text>
      <text x="270" y="355" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="15" fill="#A0A4B8">核心技术组件与选型</text>
    </g>

    <!-- Item 03 -->
    <g id="agenda-03">
      <text x="160" y="430" font-family="Consolas, 'Courier New', monospace" font-size="48" font-weight="bold" fill="#FF6B9D" fill-opacity="0.2">03</text>
      <rect x="240" y="400" width="3" height="40" rx="1.5" fill="#FF6B9D" fill-opacity="0.4"/>
      <text x="270" y="430" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="24" fill="#E8E8F0">系统架构总览</text>
      <text x="270" y="455" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="15" fill="#A0A4B8">模块关系与三层架构设计</text>
    </g>

    <!-- Item 04 -->
    <g id="agenda-04">
      <text x="160" y="530" font-family="Consolas, 'Courier New', monospace" font-size="48" font-weight="bold" fill="#00D4FF" fill-opacity="0.25">04</text>
      <rect x="240" y="500" width="3" height="40" rx="1.5" fill="#00D4FF" fill-opacity="0.4"/>
      <text x="270" y="530" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="24" fill="#E8E8F0">数据处理流程</text>
      <text x="270" y="555" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="15" fill="#A0A4B8">从上传到检索的完整链路</text>
    </g>

    <!-- Item 05 -->
    <g id="agenda-05">
      <text x="700" y="230" font-family="Consolas, 'Courier New', monospace" font-size="48" font-weight="bold" fill="#7C5CFC" fill-opacity="0.25">05</text>
      <rect x="780" y="200" width="3" height="40" rx="1.5" fill="#7C5CFC" fill-opacity="0.4"/>
      <text x="810" y="230" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="24" fill="#E8E8F0">核心模块解析</text>
      <text x="810" y="255" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="15" fill="#A0A4B8">FileLoader / VectorStore / Agent / Memory</text>
    </g>

    <!-- Item 06 -->
    <g id="agenda-06">
      <text x="700" y="330" font-family="Consolas, 'Courier New', monospace" font-size="48" font-weight="bold" fill="#00D4FF" fill-opacity="0.25">06</text>
      <rect x="780" y="300" width="3" height="40" rx="1.5" fill="#00D4FF" fill-opacity="0.4"/>
      <text x="810" y="330" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="24" fill="#E8E8F0">核心特性与亮点</text>
      <text x="810" y="355" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="15" fill="#A0A4B8">六大核心优势总结</text>
    </g>

    <!-- Item 07 -->
    <g id="agenda-07">
      <text x="700" y="430" font-family="Consolas, 'Courier New', monospace" font-size="48" font-weight="bold" fill="#FF6B9D" fill-opacity="0.2">07</text>
      <rect x="780" y="400" width="3" height="40" rx="1.5" fill="#FF6B9D" fill-opacity="0.4"/>
      <text x="810" y="430" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="24" fill="#E8E8F0">运行与部署</text>
      <text x="810" y="455" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="15" fill="#A0A4B8">命令、配置与环境变量</text>
    </g>

    <!-- Item 08 -->
    <g id="agenda-08">
      <text x="700" y="530" font-family="Consolas, 'Courier New', monospace" font-size="48" font-weight="bold" fill="#7C5CFC" fill-opacity="0.25">08</text>
      <rect x="780" y="500" width="3" height="40" rx="1.5" fill="#7C5CFC" fill-opacity="0.4"/>
      <text x="810" y="530" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="24" fill="#E8E8F0">总结</text>
      <text x="810" y="555" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="15" fill="#A0A4B8">回顾与后续展望</text>
    </g>
  </g>

  <!-- Footer -->
  <g id="page-footer">
    <rect x="80" y="680" width="1120" height="1" fill="#2A2E45" fill-opacity="0.5"/>
    <text x="1200" y="700" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#A0A4B8" fill-opacity="0.4">02 / 12</text>
  </g>
</svg>
