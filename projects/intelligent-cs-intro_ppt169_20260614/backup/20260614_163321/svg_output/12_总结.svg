<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="titleGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#7C5CFC"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="titleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feFlood flood-color="#00D4FF" flood-opacity="0.35" result="glowColor"/>
      <feComposite in="glowColor" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g id="bg-layer">
    <rect x="0" y="0" width="1280" height="720" fill="#0A0E27"/>
    <rect x="0" y="0" width="1280" height="720" fill="url(#centerGlow)"/>
  </g>

  <!-- Decorative -->
  <g id="decor">
    <circle cx="1100" cy="180" r="100" fill="none" stroke="#00D4FF" stroke-width="1" stroke-opacity="0.12"/>
    <circle cx="1100" cy="180" r="60" fill="none" stroke="#7C5CFC" stroke-width="1" stroke-opacity="0.08"/>
    <rect x="80" y="560" width="150" height="1" fill="#00D4FF" fill-opacity="0.2"/>
    <rect x="1050" y="200" width="150" height="1" fill="#7C5CFC" fill-opacity="0.15"/>
  </g>

  <!-- Main -->
  <g id="main-title">
    <text x="640" y="200" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="60" font-weight="bold" fill="url(#titleGlowGrad)" filter="url(#titleGlow)">总结</text>
  </g>

  <!-- Key takeaways -->
  <g id="takeaways">
    <rect x="200" y="260" width="880" height="310" rx="12" fill="#131837" fill-opacity="0.5" stroke="#2A2E45" stroke-width="1"/>

    <!-- T1 -->
    <g id="t1">
      <rect x="240" y="285" width="800" height="66" rx="6" fill="#1A1F3D" stroke="#2A2E45" stroke-width="0.5"/>
      <text x="280" y="315" font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="bold" fill="#00D4FF">01</text>
      <text x="330" y="315" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="18" fill="#E8E8F0">Streamlit Web 界面，开箱即用 — 一条命令启动</text>
      <text x="330" y="338" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="13" fill="#A0A4B8">streamlit run app.py</text>
    </g>

    <!-- T2 -->
    <g id="t2">
      <rect x="240" y="361" width="800" height="66" rx="6" fill="#1A1F3D" stroke="#2A2E45" stroke-width="0.5"/>
      <text x="280" y="391" font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="bold" fill="#7C5CFC">02</text>
      <text x="330" y="391" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="18" fill="#E8E8F0">7 种格式 × 中文优化分块 × 本地嵌入模型</text>
      <text x="330" y="414" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="13" fill="#A0A4B8">多格式文档一键上传，中文感知分割，CPU 友好</text>
    </g>

    <!-- T3 -->
    <g id="t3">
      <rect x="240" y="437" width="800" height="66" rx="6" fill="#1A1F3D" stroke="#2A2E45" stroke-width="0.5"/>
      <text x="280" y="467" font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="bold" fill="#FF6B9D">03</text>
      <text x="330" y="467" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="18" fill="#E8E8F0">ReAct Agent 双工具编排，文档优先 + 智能回退</text>
      <text x="330" y="490" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="13" fill="#A0A4B8">retriever → web_search，失败保护，禁止编造</text>
    </g>

    <!-- T4 -->
    <g id="t4">
      <rect x="240" y="513" width="800" height="44" rx="6" fill="#1A1F3D" stroke="#2A2E45" stroke-width="0.5"/>
      <text x="280" y="541" font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="bold" fill="#00D4FF">04</text>
      <text x="330" y="541" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="18" fill="#E8E8F0">全流程可溯源，适合企业知识库问答场景</text>
    </g>
  </g>

  <!-- Bottom -->
  <g id="closing">
    <text x="640" y="640" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="22" fill="#A0A4B8">智能客服系统 = RAG + LangGraph Agent + ChromaDB</text>
    <text x="640" y="672" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="16" fill="#A0A4B8" fill-opacity="0.5">轻量高效 · 即装即用 · 中文优化</text>

    <rect x="540" y="690" width="80" height="2" rx="1" fill="#00D4FF" fill-opacity="0.4"/>
    <rect x="628" y="690" width="40" height="2" rx="1" fill="#7C5CFC" fill-opacity="0.3"/>
    <rect x="676" y="690" width="64" height="2" rx="1" fill="#00D4FF" fill-opacity="0.4"/>
  </g>

  <g id="page-footer">
    <text x="1200" y="705" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#A0A4B8" fill-opacity="0.4">12 / 12</text>
  </g>
</svg>
