<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#7C5CFC"/>
    </linearGradient>
  </defs>

  <g id="bg-layer">
    <rect x="0" y="0" width="1280" height="720" fill="#0A0E27"/>
  </g>

  <g id="page-header">
    <rect x="80" y="42" width="4" height="32" rx="2" fill="url(#accentLine)"/>
    <text x="100" y="68" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="36" font-weight="bold" fill="#E8E8F0">运行与部署</text>
    <text x="100" y="90" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" fill="#A0A4B8" letter-spacing="2">RUN &amp; DEPLOY — COMMANDS · CONFIGURATION · ENVIRONMENT VARIABLES</text>
  </g>

  <!-- LEFT: Commands -->
  <g id="left-commands">
    <rect x="80" y="130" width="540" height="525" rx="10" fill="#131837" fill-opacity="0.4" stroke="#2A2E45" stroke-width="1"/>
    <use data-icon="phosphor-duotone/terminal-window" x="110" y="155" width="28" height="28" fill="#00D4FF"/>
    <text x="150" y="175" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="20" font-weight="bold" fill="#E8E8F0">命令速查</text>

    <!-- Command 1: Install -->
    <g id="cmd-install">
      <rect x="108" y="200" width="484" height="78" rx="6" fill="#1A1F3D" stroke="#2A2E45" stroke-width="1"/>
      <rect x="108" y="200" width="6" height="78" rx="3" fill="#00E676" fill-opacity="0.5"/>
      <text x="130" y="225" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" font-weight="bold" fill="#00E676">安装依赖</text>
      <rect x="130" y="236" width="440" height="32" rx="4" fill="#0A0E27"/>
      <text x="146" y="258" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#E8E8F0">pip install -r requirements.txt</text>
    </g>

    <!-- Command 2: Run -->
    <g id="cmd-run">
      <rect x="108" y="292" width="484" height="78" rx="6" fill="#1A1F3D" stroke="#2A2E45" stroke-width="1"/>
      <rect x="108" y="292" width="6" height="78" rx="3" fill="#00D4FF" fill-opacity="0.5"/>
      <text x="130" y="317" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" font-weight="bold" fill="#00D4FF">启动应用</text>
      <rect x="130" y="328" width="440" height="32" rx="4" fill="#0A0E27"/>
      <text x="146" y="350" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#E8E8F0">streamlit run app.py</text>
    </g>

    <!-- Command 3: Test -->
    <g id="cmd-test">
      <rect x="108" y="384" width="484" height="78" rx="6" fill="#1A1F3D" stroke="#2A2E45" stroke-width="1"/>
      <rect x="108" y="384" width="6" height="78" rx="3" fill="#7C5CFC" fill-opacity="0.5"/>
      <text x="130" y="409" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" font-weight="bold" fill="#7C5CFC">运行测试</text>
      <rect x="130" y="420" width="440" height="32" rx="4" fill="#0A0E27"/>
      <text x="146" y="442" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#E8E8F0">pytest tests/ -v</text>
    </g>

    <!-- Command 4: Single test -->
    <g id="cmd-single">
      <rect x="108" y="476" width="484" height="78" rx="6" fill="#1A1F3D" stroke="#2A2E45" stroke-width="1"/>
      <rect x="108" y="476" width="6" height="78" rx="3" fill="#FF6B9D" fill-opacity="0.5"/>
      <text x="130" y="501" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" font-weight="bold" fill="#FF6B9D">单独测试</text>
      <rect x="130" y="512" width="440" height="32" rx="4" fill="#0A0E27"/>
      <text x="146" y="534" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#E8E8F0">pytest tests/test_agent.py::TestTools::test_retriever</text>
    </g>
  </g>

  <!-- RIGHT: Config -->
  <g id="right-config">
    <rect x="640" y="130" width="560" height="525" rx="10" fill="#131837" fill-opacity="0.4" stroke="#2A2E45" stroke-width="1"/>
    <use data-icon="phosphor-duotone/gear" x="670" y="155" width="28" height="28" fill="#7C5CFC"/>
    <text x="710" y="175" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="20" font-weight="bold" fill="#E8E8F0">环境配置</text>

    <!-- .env -->
    <g id="env-config">
      <rect x="668" y="200" width="504" height="130" rx="8" fill="#1A1F3D" stroke="#2A2E45" stroke-width="1"/>
      <text x="692" y="225" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" fill="#00D4FF">.env 文件</text>

      <rect x="692" y="238" width="460" height="80" rx="4" fill="#0A0E27"/>
      <text x="710" y="260" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#A0A4B8">ANTHROPIC_AUTH_TOKEN=sk-xxx</text>
      <text x="710" y="280" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#A0A4B8">ANTHROPIC_BASE_URL=https://api.deepseek.com/anthropic</text>
      <text x="710" y="300" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#A0A4B8">ANTHROPIC_MODEL=deepseek-v4-pro</text>
    </g>

    <!-- LLM Endpoint -->
    <g id="llm-config">
      <rect x="668" y="346" width="504" height="100" rx="8" fill="#1A1F3D" stroke="#2A2E45" stroke-width="1"/>
      <text x="692" y="371" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="16" font-weight="bold" fill="#E8E8F0">LLM 端点</text>
      <text x="692" y="395" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" fill="#A0A4B8">DeepSeek OpenAI-compatible /v1 endpoint</text>
      <text x="692" y="418" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="13" fill="#A0A4B8" fill-opacity="0.7">ChatOpenAI 协议兼容 — 非 Anthropic 原生 API</text>
      <text x="692" y="438" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#7C5CFC">LLM_OPENAI_BASE_URL = "https://api.deepseek.com/v1"</text>
    </g>

    <!-- Data Persistence -->
    <g id="data-paths">
      <rect x="668" y="462" width="504" height="130" rx="8" fill="#1A1F3D" stroke="#2A2E45" stroke-width="1"/>
      <text x="692" y="487" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="16" font-weight="bold" fill="#E8E8F0">数据目录</text>

      <rect x="692" y="500" width="225" height="36" rx="4" fill="#0A0E27"/>
      <text x="706" y="523" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#00D4FF">data/chroma_db/</text>
      <text x="880" y="523" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="12" fill="#A0A4B8">向量库</text>

      <rect x="932" y="500" width="225" height="36" rx="4" fill="#0A0E27"/>
      <text x="946" y="523" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#7C5CFC">data/uploads/</text>
      <text x="1100" y="523" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="12" fill="#A0A4B8">原始文件</text>

      <rect x="692" y="546" width="460" height="36" rx="4" fill="#0A0E27"/>
      <text x="706" y="569" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#FF6B9D">data/app.log</text>
      <text x="860" y="569" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="12" fill="#A0A4B8">日志文件 · UTF-8 编码 · 侧边栏可查看</text>
    </g>
  </g>

  <!-- Bottom note -->
  <g id="bottom-note">
    <rect x="80" y="670" width="1120" height="1" fill="#2A2E45" fill-opacity="0.5"/>
    <text x="1200" y="695" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#A0A4B8" fill-opacity="0.4">11 / 12</text>
  </g>
</svg>
