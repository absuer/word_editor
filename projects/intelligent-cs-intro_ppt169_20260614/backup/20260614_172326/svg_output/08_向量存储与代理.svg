<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="bg-layer"><rect x="0" y="0" width="1280" height="720" fill="#EDEFF4"/></g>
  <g id="page-header">
    <rect x="80" y="42" width="4" height="28" rx="2" fill="#1A73E8"/>
    <text x="100" y="66" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="36" font-weight="bold" fill="#1A1D2E">向量存储 &amp; 智能代理</text>
    <text x="100" y="86" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="13" fill="#6B7280" letter-spacing="2">VECTORSTORE · CHROMADB &amp; AGENT · LANGGRAPH REACT</text>
  </g>

  <!-- Left -->
  <g id="left"><rect x="80" y="110" width="550" height="545" fill="#FFFFFF" stroke="#D8DAE4" stroke-width="0.5"/>
    <rect x="80" y="110" width="550" height="4" fill="#1A73E8"/>
    <use data-icon="phosphor-duotone/database" x="110" y="137" width="28" height="28" fill="#1A73E8"/>
    <text x="150" y="157" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="22" font-weight="bold" fill="#1A1D2E">VectorStoreManager</text>
    <text x="150" y="177" font-family="Consolas, 'Courier New', monospace" font-size="10" fill="#1A73E8" letter-spacing="1">CHROMADB + HUGGINGFACE EMBEDDINGS</text>

    <rect x="108" y="200" width="494" height="90" fill="#F5F6FA"/>
    <text x="128" y="225" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="16" font-weight="bold" fill="#1A1D2E">Embedding 模型</text>
    <text x="128" y="248" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" fill="#6B7280">paraphrase-multilingual-MiniLM-L12-v2</text>
    <text x="128" y="270" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="13" fill="#6B7280">本地 CPU · normalize_embeddings=True · HF Mirror 回退</text>

    <rect x="108" y="302" width="494" height="130" fill="#FFFFFF"/>
    <text x="128" y="327" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="16" font-weight="bold" fill="#1A1D2E">ChromaDB 向量库</text>
    <text x="128" y="352" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" fill="#6B7280">懒加载初始化 (self._store property)</text>
    <text x="128" y="374" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" fill="#6B7280">去重: source + chunk_index 组合 key</text>
    <text x="128" y="396" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" fill="#6B7280">持久化: data/chroma_db/</text>
    <text x="128" y="418" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="13" fill="#6B7280">close() 释放 Chroma 资源锁 (Windows 必需)</text>

    <rect x="108" y="446" width="235" height="90" fill="#F5F6FA"/>
    <text x="128" y="472" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" fill="#1A73E8">search(query, k=4)</text>
    <text x="128" y="494" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="13" fill="#6B7280">similarity_search 语义检索</text>
    <text x="128" y="516" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="13" fill="#6B7280">返回 Top-K 最相关分块</text>

    <rect x="360" y="446" width="242" height="90" fill="#FFFFFF"/>
    <text x="380" y="472" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" fill="#6C3FD4">get_source_files()</text>
    <text x="380" y="494" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="13" fill="#6B7280">collection.get(metadatas)</text>
    <text x="380" y="516" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="13" fill="#6B7280">页面刷新恢复文件列表</text>
  </g>

  <!-- Right -->
  <g id="right"><rect x="648" y="110" width="552" height="545" fill="#FFFFFF" stroke="#D8DAE4" stroke-width="0.5"/>
    <rect x="648" y="110" width="552" height="4" fill="#6C3FD4"/>
    <use data-icon="phosphor-duotone/brain" x="678" y="137" width="28" height="28" fill="#6C3FD4"/>
    <text x="718" y="157" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="22" font-weight="bold" fill="#1A1D2E">AgentManager</text>
    <text x="718" y="177" font-family="Consolas, 'Courier New', monospace" font-size="10" fill="#6C3FD4" letter-spacing="1">LANGGRAPH REACT · DEEPSEEK LLM</text>

    <rect x="676" y="200" width="496" height="70" fill="#F5F6FA"/>
    <text x="696" y="225" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="16" font-weight="bold" fill="#1A1D2E">ChatOpenAI → DeepSeek</text>
    <text x="696" y="246" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="13" fill="#6B7280">model: deepseek-v4-pro · temperature: 0.3</text>
    <text x="696" y="264" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="12" fill="#6B7280">OpenAI-compatible: https://api.deepseek.com/v1</text>

    <rect x="676" y="282" width="496" height="110" fill="#FFFFFF"/>
    <text x="696" y="307" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="16" font-weight="bold" fill="#1A1D2E">双工具协同</text>
    <rect x="696" y="320" width="230" height="60" fill="#F5F6FA"/>
    <use data-icon="phosphor-duotone/magnifying-glass" x="708" y="338" width="18" height="18" fill="#1A73E8"/>
    <text x="734" y="352" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="bold" fill="#1A73E8">retriever</text>
    <text x="708" y="372" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="12" fill="#6B7280">文档语义检索 · 优先调用</text>

    <rect x="942" y="320" width="210" height="60" fill="#F5F6FA"/>
    <use data-icon="phosphor-duotone/globe-hemisphere-east" x="954" y="338" width="18" height="18" fill="#E8456B"/>
    <text x="980" y="352" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="bold" fill="#E8456B">web_search</text>
    <text x="954" y="372" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="12" fill="#6B7280">DuckDuckGo · 回退</text>

    <rect x="676" y="406" width="496" height="90" fill="#F5F6FA"/>
    <text x="696" y="431" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="16" font-weight="bold" fill="#1A1D2E">流式输出 · stream_chat()</text>
    <text x="696" y="454" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="13" fill="#6B7280">values 模式实时 yield 完整响应文本</text>
    <text x="696" y="476" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="13" fill="#6B7280">检索原文收集到 last_retrieved_docs · 工具调用日志</text>

    <rect x="676" y="510" width="496" height="50" fill="#F5F6FA"/>
    <text x="696" y="533" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="13" fill="#6B7280">📋 中文 System Prompt: 文档优先 → 网络回退 → 禁止编造 → 注明来源</text>
    <text x="696" y="552" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="12" fill="#6B7280">web_search 失败后禁止重复调用 · 直接告知用户</text>
  </g>

  <g id="page-footer">
    <rect x="80" y="680" width="1120" height="1" fill="#D8DAE4"/>
    <text x="1200" y="700" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#6B7280">08 / 12</text>
  </g>
</svg>
