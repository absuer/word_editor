      <text x="326" y="368" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="12" fill="#6B7280">解析客户 8D 报告结构 (D0-D8)</text>
      <text x="326" y="386" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="12" fill="#6B7280">自动识别问题描述 · 围堵措施 · 根因 · 永久对策</text>
