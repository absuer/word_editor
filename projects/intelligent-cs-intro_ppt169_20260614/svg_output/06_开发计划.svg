      <text x="686" y="404" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="11" fill="#6B7280">从历史案例中推荐可能根因分支</text>
    </g>

    <!-- Task 3: 5Why -->
