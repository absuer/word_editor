    <text x="190" y="172" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" fill-opacity="0.85">当前阶段</text>
    <text x="190" y="198" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#FFFFFF" fill-opacity="0.6">CURRENT</text>

