      <text x="326" y="464" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="12" fill="#6B7280">逐步追问式根因挖掘 · 避免停留在表象</text>
      <text x="326" y="480" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="11" fill="#6B7280">Agent 自动检测逻辑断裂 · 提示补充证据</text>
