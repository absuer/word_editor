      <text x="714" y="444" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="15" font-weight="bold" fill="#1A1D2E">纠正 vs 纠正措施</text>
      <text x="686" y="464" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="12" fill="#6B7280">区分 Correction / Corrective Action / Preventive Action</text>
