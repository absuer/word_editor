      <rect x="310" y="184" width="260" height="36" fill="#FFFFFF"/>
      <use data-icon="phosphor-duotone/brain" x="322" y="194" width="16" height="16" fill="#1A73E8"/>
      <text x="346" y="207" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="13" fill="#1A1D2E">LangGraph ReAct Agent 编排</text>

