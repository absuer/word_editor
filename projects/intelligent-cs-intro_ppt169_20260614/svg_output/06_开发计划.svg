    <text x="100" y="65" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="12" fill="#6B7280" letter-spacing="2">DEVELOPMENT ROADMAP — FROM Q&amp;A DEMO TO INTELLIGENT CS PLATFORM</text>
  </g>

  <!-- ═══ PHASE 1 — Current ═══ -->
