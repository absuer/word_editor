    <text x="150" y="152" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="20" font-weight="bold" fill="#1A1D2E">命令速查</text>

    <g id="cmd1"><rect x="108" y="175" width="494" height="78" fill="#F5F6FA" />
      <rect x="108" y="175" width="4" height="78" fill="#00C853" />
      <text x="128" y="202" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" font-weight="bold" fill="#00C853">安装依赖</text>
      <rect x="128" y="214" width="450" height="30" fill="#EDEFF4" />
      <text x="144" y="235" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1A1D2E">pip install -r requirements.txt</text>
    </g>
    <g id="cmd2"><rect x="108" y="265" width="494" height="78" fill="#FFFFFF" />
      <rect x="108" y="265" width="4" height="78" fill="#1A73E8" />
      <text x="128" y="292" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" font-weight="bold" fill="#1A73E8">启动应用</text>
      <rect x="128" y="304" width="450" height="30" fill="#EDEFF4" />
      <text x="144" y="325" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1A1D2E">streamlit run app.py</text>
    </g>
    <g id="cmd3"><rect x="108" y="355" width="494" height="78" fill="#F5F6FA" />
      <rect x="108" y="355" width="4" height="78" fill="#6C3FD4" />
      <text x="128" y="382" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" font-weight="bold" fill="#6C3FD4">运行测试</text>
      <rect x="128" y="394" width="450" height="30" fill="#EDEFF4" />
      <text x="144" y="415" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1A1D2E">pytest tests/ -v</text>
    </g>
    <g id="cmd4"><rect x="108" y="445" width="494" height="78" fill="#FFFFFF" />
      <rect x="108" y="445" width="4" height="78" fill="#E8456B" />
      <text x="128" y="472" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" font-weight="bold" fill="#E8456B">单独测试</text>
      <rect x="128" y="484" width="450" height="30" fill="#EDEFF4" />
      <text x="144" y="505" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1A1D2E">pytest tests/test_agent.py -k test_retriever</text>
    </g>

    <rect x="108" y="545" width="494" height="80" fill="#F5F6FA" />
    <text x="128" y="572" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" font-weight="bold" fill="#1A1D2E">测试覆盖</text>
    <text x="128" y="595" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="13" fill="#6B7280">test_e2e.py: 文件加载 → 向量存储 → 搜索 → Agent 创建 → 记忆</text>
    <text x="128" y="615" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="13" fill="#6B7280">tempfile.TemporaryDirectory 隔离 · store.close() 释放文件锁</text>
  </g>

  
