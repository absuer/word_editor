    <text x="718" y="152" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="20" font-weight="bold" fill="#1A1D2E">环境配置</text>

    <rect x="676" y="175" width="496" height="140" fill="#F5F6FA" />
    <text x="696" y="200" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" fill="#1A73E8">.env 文件</text>
    <rect x="696" y="214" width="456" height="85" fill="#EDEFF4" />
    <text x="714" y="236" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#1A1D2E">ANTHROPIC_AUTH_TOKEN=sk-xxx</text>
    <text x="714" y="256" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#1A1D2E">ANTHROPIC_BASE_URL=https://api.deepseek.com/anthropic</text>
    <text x="714" y="276" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#1A1D2E">ANTHROPIC_MODEL=deepseek-v4-pro</text>
    <text x="714" y="294" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="11" fill="#6B7280">.env gitignored · python-dotenv 加载</text>

    <rect x="676" y="330" width="496" height="80" fill="#FFFFFF" />
    <text x="696" y="355" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="15" font-weight="bold" fill="#1A1D2E">LLM 端点</text>
    <text x="696" y="378" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="13" fill="#6B7280">DeepSeek OpenAI-compatible /v1 endpoint</text>
    <text x="696" y="398" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#6C3FD4">LLM_OPENAI_BASE_URL = "https://api.deepseek.com/v1"</text>

    <rect x="676" y="425" width="496" height="95" fill="#F5F6FA" />
    <text x="696" y="450" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="15" font-weight="bold" fill="#1A1D2E">数据目录</text>
    <text x="696" y="475" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1A73E8">data/chroma_db/</text>
    <text x="860" y="475" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="13" fill="#6B7280">向量库持久化</text>
    <text x="696" y="496" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#6C3FD4">data/uploads/</text>
    <text x="860" y="496" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="13" fill="#6B7280">原始文件 UUID 保存</text>
