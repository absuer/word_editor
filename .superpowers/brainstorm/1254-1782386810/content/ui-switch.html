<h2>单编辑器切换逻辑</h2>
<p class="subtitle">页面同一时间只显示一个编辑器，根据文件类型自动切换</p>

<div class="mockup" style="margin-bottom: 2rem;">
  <div class="mockup-header">切换流程</div>
  <div class="mockup-body">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 20px;">

      <!-- Step 1 -->
      <div style="background: #e3f2fd; border: 2px solid #1976d2; border-radius: 8px; padding: 12px 20px; width: 100%; text-align: center;">
        <strong>📤 Streamlit 上传文件</strong>
        <div style="color: #555; font-size: 13px; margin-top: 4px;">用户上传 → Streamlit 读文件内容 + 文件名</div>
      </div>

      <div style="font-size: 24px; color: #999;">↓</div>

      <!-- Step 2 -->
      <div style="background: #fff3e0; border: 2px solid #f57c00; border-radius: 8px; padding: 12px 20px; width: 100%; text-align: center;">
        <strong>🔀 Vue 判断扩展名</strong>
        <div style="color: #555; font-size: 13px; margin-top: 4px;">.docx → WordEditor &nbsp;&nbsp;|&nbsp;&nbsp; .xlsx → ExcelEditor</div>
      </div>

      <div style="font-size: 24px; color: #999;">↓</div>

      <!-- Step 3a - Word -->
      <div style="display: flex; gap: 16px; width: 100%; align-items: center;">
        <div style="background: #e8f5e9; border: 2px solid #4caf50; border-radius: 8px; padding: 16px; flex: 1; text-align: center;">
          <strong>📝 docx 文件</strong>
          <div style="margin-top: 8px; border: 1px solid #c8e6c9; border-radius: 4px; background: #fff; padding: 8px;">
            <div style="background: #f5f5f5; border-bottom: 1px solid #ddd; padding: 4px 8px; display: flex; gap: 5px; font-size: 11px;">
              <span style="border:1px solid #ccc;border-radius:2px;padding:1px 5px;">B</span>
              <span style="border:1px solid #ccc;border-radius:2px;padding:1px 5px;"><i>I</i></span>
              <span style="border:1px solid #ccc;border-radius:2px;padding:1px 5px;"><u>U</u></span>
              <span style="color:#ccc;">|</span>
              <span style="border:1px solid #ccc;border-radius:2px;padding:1px 5px;">H1</span>
              <span style="border:1px solid #ccc;border-radius:2px;padding:1px 5px;">H2</span>
            </div>
            <div style="padding: 16px; min-height: 60px; text-align: left; font-size: 13px;">
              <strong>文档标题</strong><br/>
              <span style="color:#666;">可编辑的富文本内容...</span>
            </div>
          </div>
        </div>
        <div style="font-size: 20px; color: #999;">或</div>
        <div style="background: #fce4ec; border: 2px solid #e91e63; border-radius: 8px; padding: 16px; flex: 1; text-align: center; opacity: 0.3;">
          <strong>📊 xlsx 文件（隐藏）</strong>
          <div style="margin-top: 4px; font-size: 11px; color: #999;">当前不渲染</div>
        </div>
      </div>

    </div>
  </div>
</div>

<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
  <div style="border: 1px solid #e0e0e0; border-radius: 6px; padding: 12px;">
    <strong>📝 WordEditor 激活条件</strong>
    <p style="margin: 4px 0 0; font-size: 13px; color: #555;">文件名以 .docx 结尾</p>
  </div>
  <div style="border: 1px solid #e0e0e0; border-radius: 6px; padding: 12px;">
    <strong>📊 ExcelEditor 激活条件</strong>
    <p style="margin: 4px 0 0; font-size: 13px; color: #555;">文件名以 .xlsx 结尾</p>
  </div>
</div>
